<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f4228"/>
      <stop offset="100%" stop-color="#072214"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- App Rounded Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>

  <!-- Golden Orbit Line -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="#b48c36" stroke-width="4.5" stroke-dasharray="8 8" opacity="0.85"/>
  
  <!-- Star on Orbit -->
  <polygon points="384,124 390,136 403,138 393,147 396,160 384,153 372,160 375,147 365,138 378,136" fill="#f0c242"/>

  <!-- White Map Pin -->
  <g filter="url(#shadow)">
    <path d="M256 94 C195 94 148 141 148 202 C148 274 256 384 256 384 C256 384 364 274 364 202 C364 141 317 94 256 94 Z" fill="#ffffff"/>
  </g>

  <!-- Golden Harp / Violão Emblem in Center -->
  <g transform="translate(224, 168)">
    <!-- Lyre/Harp body -->
    <path d="M6 14 C12 2, 24 0, 32 8 C40 0, 52 2, 58 14 C64 28, 54 58, 48 64 C38 72, 26 72, 16 64 C10 58, 0 28, 6 14 Z" fill="#c99732"/>
    <!-- Strings and sound hole -->
    <line x1="26" y1="18" x2="26" y2="58" stroke="#0f4228" stroke-width="3" stroke-linecap="round"/>
    <line x1="32" y1="14" x2="32" y2="62" stroke="#0f4228" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="38" y1="18" x2="38" y2="58" stroke="#0f4228" stroke-width="3" stroke-linecap="round"/>
    <!-- Rosette / sound hole ring -->
    <circle cx="32" cy="38" r="6.5" fill="#f9f7f2" stroke="#c99732" stroke-width="2.5"/>
    <circle cx="32" cy="38" r="3" fill="#0f4228"/>
  </g>
</svg>
